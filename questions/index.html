<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Questions — Samjho Admin</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background: #f5f7fb; color: #1f2a37; }
    .admin-shell { display: flex; min-height: 100vh; }
    .admin-sidebar { width: 240px; background: #1f2a37; color: #fff; padding: 24px 16px; }
    .admin-main { flex: 1; padding: 32px; }
    .admin-brand { font-weight: 700; letter-spacing: 0.5px; }
    .admin-nav { margin-top: 24px; }
    .admin-nav a { display: block; color: #cdd6e2; text-decoration: none; padding: 10px 12px; border-radius: 8px; }
    .admin-nav a:hover { background: #2c3a4d; color: #fff; }
    .admin-banner { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(18,26,38,0.08); }
    .admin-status { margin-top: 16px; font-size: 14px; color: #52606d; }
    .admin-separator { height: 1px; background: #2c3a4d; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand">Samjho Admin</div>
      <nav class="admin-nav">
        <a href="/admin/">Dashboard</a>
        <a href="/admin/questions/">Questions</a>
        <a href="/admin/content/">Content</a>
      </nav>
      <div class="admin-separator"></div>
      <div class="admin-status">Questions section placeholder</div>
    </aside>
    <main class="admin-main">
      <div class="admin-banner">
        <h1>Questions Section</h1>
        <p>Question content structure is reserved here. No question data is loaded yet.</p>
      </div>
    </main>
  </div>
</body>
</html>
